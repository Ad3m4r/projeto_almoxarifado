<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Almoxarifado</h1>

        <div id="equipamento">
            Carregando...
        </div>

    </div>

   <script>
    function carregarEquipamento() {
    fetch('/equipamento')
        .then(response => response.json())
        .then(equipamento => {
            document.getElementById('equipamento').innerHTML = `
                <h2>Código: ${equipamento.codigo}</h2>
                <p>Nome: ${equipamento.nome}</p>
                <p>Situação: ${equipamento.situacao ? 'Disponível' : 'Indisponível'}</p>

                ${
                    equipamento.situacao
                    ? '<button class="disponivel" onclick="emprestarEquipamento()">Emprestar</button>'
                    : '<button class="indisponivel" onclick="devolverEquipamento()">Devolver</button>'
                }
            `;
        });
    }

    function emprestarEquipamento() {
        fetch('/equipamento/emprestar')
            .then(() => carregarEquipamento());
    }

    function devolverEquipamento() {
        fetch('/equipamento/devolver')
            .then(() => carregarEquipamento());
    }

    carregarEquipamento();
</script>

</body>
</html>
